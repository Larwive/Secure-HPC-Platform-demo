services:
  login:
    image: ruby:3.2
    volumes:
      - .:/app
      - ./data:/data:ro
      - ./jobs_encrypted:/jobs_encrypted:rw
      - ./data_encrypted:/data_encrypted:rw
    working_dir: /app
    entrypoint: ["ruby", "bin/submit_job.rb"]

  secure-compute:
    build: ./secure-compute
    image: python:3.12
    volumes:
      - ./secure-compute:/secure-compute
      - ./jobs_encrypted:/jobs:ro
      - ./data_encrypted:/data:ro
      - ./output:/output:rw
    working_dir: /secure-compute
    command: ["python", "worker.py"]
